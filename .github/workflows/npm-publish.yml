name: Publish to npm (manual)

# Manual npm-only publish. Use to (re)publish a tagged version to npm
# without re-running the full release pipeline (e.g. when a prior release's
# npm step failed but the Marketplace publish already succeeded).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v0.2.15)"
        required: true

permissions:
  contents: read
  # See release.yml — the OIDC token this workflow publishes with.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          # Must match release.yml: trusted publishing needs npm 11.5.1+.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # npm holds a second trusted publisher for this filename, so the manual
      # rescue path publishes over OIDC too and needs no token either.
      - name: Publish to npm as @entropicwarrior/sdoc
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.name = '@entropicwarrior/sdoc';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --access public
