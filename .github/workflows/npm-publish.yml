name: Publish to npm (manual)

# Manual npm-only publish. Use to (re)publish a tagged version to npm
# without re-running the full release pipeline (e.g. when a prior release's
# npm step failed but the Marketplace publish already succeeded).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v0.2.15)"
        required: true

permissions:
  contents: read
  # See release.yml — the OIDC token this workflow publishes with.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          # Must match release.yml: trusted publishing needs npm 11.5.1+.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # npm holds a second trusted publisher for this filename, so the manual
      # rescue path publishes over OIDC too and needs no token either. Verified
      # working 8 Oct 2026 — and it had to be repaired first, which is the part
      # worth knowing: the connection was listed by `npm trust list` with the
      # right repository, the right filename and both permissions, and was
      # refused every time. Revoking it and creating an identical one fixed it
      # at once. A listed trusted publisher is not a working one, and nothing
      # in the listing tells the two apart.
      #
      # `--loglevel verbose` stays. Without it a failure here says only
      # `E404 ... PUT https://registry.npmjs.org/@entropicwarrior%2fsdoc`,
      # which is about neither the package nor the real cause: npm falls back
      # to the placeholder token setup-node writes, and the registry answers an
      # unauthenticated write to an existing package with 404 rather than 403.
      # The flag is what surfaces the line that matters —
      # `oidc Failed token exchange request ... OIDC token exchange error`.
      # Diagnosing this without it cost four runs and a wrong hypothesis.
      - name: Publish to npm as @entropicwarrior/sdoc
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.name = '@entropicwarrior/sdoc';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --access public --loglevel verbose
