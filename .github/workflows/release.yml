name: Build VSIX, publish to Marketplace and npm

on:
  release:
    types: [published]

permissions:
  contents: write
  # Lets the runner mint the short-lived OIDC token npm exchanges for publish
  # rights. Without it npm falls back to looking for a token and fails.
  id-token: write

# Two independent jobs, deliberately. They were one, in this order: package,
# upload the VSIX, publish to the Marketplace, publish to npm — so when the
# Marketplace answered v0.3.0 with an HTTP 503, the job stopped there and the
# npm step never ran at all. The two registries have nothing to do with one
# another, and an outage at one should not hold back the other.
#
# Each job checks out and installs for itself rather than passing the package
# between them. That is a little more runner time for a lot less coupling: a
# job that needs nothing from another cannot be held up by one.
jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - run: mkdir -p dist && npx vsce package --out dist/

      - name: Upload VSIX to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.vsix --clobber

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --pat "$VSCE_PAT"

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not 20: trusted publishing needs npm 11.5.1+, which Node 20 does
          # not ship, and GitHub already forces Node-20 actions onto 24 with a
          # deprecation warning.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # setup-node pins the npm that shipped with the Node it installed, so ask
      # for the version explicitly rather than inferring it from the runtime.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm install

      # Goes out over OIDC, against the trusted publisher npm holds for this
      # repository and this workflow filename. Renaming this file, or moving the
      # repository, breaks the trust and the release with it — npm matches the
      # filename in the OIDC claim. The JOB name is not part of that claim, so
      # splitting the work into jobs inside this file is safe; renaming the file
      # is not.
      #
      # No NODE_AUTH_TOKEN. A token here would be the credential npm reaches for
      # first, so leaving one set would mean never finding out whether OIDC
      # actually works.
      - name: Publish to npm as @entropicwarrior/sdoc
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.name = '@entropicwarrior/sdoc';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm publish --access public
